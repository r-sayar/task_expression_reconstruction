name: run_benchmark
namespace: workflows

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input_train"
        __merge__: /src/api/file_train.yaml
        type: file
        direction: input
        required: true
      - name: "--input_test"
        __merge__: /src/api/file_test.yaml
        type: file
        direction: input
        required: true
      - name: "--input_solution"
        __merge__: /src/api/file_solution.yaml
        type: file
        direction: input
        required: true
  - name: Outputs
    arguments:
      - name: "--output_scores"
        type: file
        required: true
        direction: output
        description: A yaml file containing the scores of each of the methods
        default: score_uns.yaml
      - name: "--output_method_configs"
        type: file
        required: true
        direction: output
        default: method_configs.yaml
      - name: "--output_metric_configs"
        type: file
        required: true
        direction: output
        default: metric_configs.yaml
      - name: "--output_dataset_info"
        type: file
        required: true
        direction: output
        default: dataset_uns.yaml
      - name: "--output_task_info"
        type: file
        required: true
        direction: output
        default: task_info.yaml
  - name: Methods
    arguments:
      - name: "--method_ids"
        type: string
        multiple: true
        description: |
          A list of method (base) ids to run, e.g. `ae_l32`, `nlscvi_l512`,
          `pca_l128`, `ground_truth`. If not specified, all methods run across
          the full latent x seed grid.
  - name: Metrics
    arguments:
      - name: "--reference_condition_column"
        type: string
        required: false
        description: |
          Passed through to the biological and knn_purity metric components:
          an .obs column on the dataset (e.g. LuCA's real `disease`) used to
          derive a reference/control condition when no separate reference/
          perturbation-pool files are supplied. See those components' own
          argument docs for details. No effect on datasets without this
          column (e.g. the CI/synthetic fixtures).
      - name: "--reference_condition_value"
        type: string
        required: false
        description: |
          The value in --reference_condition_column identifying the
          reference/control condition (e.g. `normal`).
      - name: "--cytokine_signatures"
        type: file
        required: false
        description: |
          Passed through to the biological metric component's own
          --cytokine_signatures arg (an Immune Dictionary cytokine
          signature CSV). See that component's argument docs for details.

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /_viash.yaml
  - type: file
    path: optimal_settings.yaml

dependencies:
  - name: utils/extract_uns_metadata
    repository: openproblems
  - name: control_methods/ground_truth
  - name: control_methods/negative_control
  - name: methods/pca_reconstruction
  - name: methods/autoencoder
  - name: methods/scvi
  - name: metrics/statistical
  - name: metrics/biological
  - name: metrics/knn_purity

runners:
  - type: nextflow
