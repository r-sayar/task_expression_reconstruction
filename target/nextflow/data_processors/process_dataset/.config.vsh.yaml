name: "process_dataset"
namespace: "data_processors"
version: "build_fix_ci_test_fixtures"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    label: "Common Dataset"
    summary: "Raw or preprocessed LuCA expression data."
    info:
      format:
        type: "h5ad"
        obs:
        - type: "string"
          name: "cell_type"
          description: "Cell type annotation"
          required: false
        - type: "string"
          name: "dataset"
          description: "Study / dataset identifier within LuCA"
          required: false
        - type: "string"
          name: "origin"
          description: "Tissue origin (e.g. tumor_primary, normal_adjacent)"
          required: false
        uns:
        - type: "string"
          name: "dataset_id"
          description: "Unique dataset identifier"
          required: true
        - type: "string"
          name: "dataset_name"
          description: "Human-readable dataset name"
          required: true
        - type: "string"
          name: "normalization_id"
          description: "Normalization applied to .X"
          required: true
    example:
    - "resources_test/common/luca/dataset.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_train"
    label: "Training data"
    summary: "Training cells for reconstruction methods."
    info:
      format:
        type: "h5ad"
        uns:
        - type: "string"
          name: "dataset_id"
          description: "Unique dataset identifier"
          required: true
        - type: "string"
          name: "normalization_id"
          description: "Normalization applied to .X"
          required: true
    example:
    - "resources_test/reconeval/luca/train.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_test"
    label: "Test data"
    summary: "Held-out test cells whose expression will be reconstructed."
    info:
      format:
        type: "h5ad"
        uns:
        - type: "string"
          name: "dataset_id"
          description: "Unique dataset identifier"
          required: true
        - type: "string"
          name: "normalization_id"
          description: "Normalization applied to .X"
          required: true
    example:
    - "resources_test/reconeval/luca/test.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_solution"
    label: "Solution"
    summary: "Ground-truth expression for held-out test cells."
    info:
      format:
        type: "h5ad"
        uns:
        - type: "string"
          name: "dataset_id"
          description: "Unique dataset identifier"
          required: true
        - type: "string"
          name: "normalization_id"
          description: "Normalization applied to .X"
          required: true
    example:
    - "resources_test/reconeval/luca/solution.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--method"
    description: "Train/test split strategy."
    info: null
    default:
    - "random"
    required: false
    choices:
    - "random"
    - "origin"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_hvg"
    description: "Number of highly variable genes to retain."
    info: null
    default:
    - 2000
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--test_fraction"
    description: "Fraction of cells assigned to the test set (random split)."
    info: null
    default:
    - 0.2
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obs_origin"
    description: ".obs column used for origin-based splits."
    info: null
    default:
    - "origin"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--test_origin"
    description: "Origin label held out for testing when method=origin."
    info: null
    default:
    - "tumor_primary"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--seed"
    description: "Random seed for splitting and HVG selection."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
test_resources:
- type: "file"
  path: "resources_test/common/luca"
  dest: "resources_test/common/luca"
- type: "python_script"
  path: "run_and_check_output.py"
  is_executable: true
info:
  preferred_normalization: "log_cp10k"
  type: "data_processor"
  type_info:
    label: "Data processor"
    summary: "Process a common dataset into train/test/solution splits."
    description: "Normalizes expression, selects highly variable genes, and splits\
      \ cells\ninto train and held-out test sets for gene-expression reconstruction.\n"
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
license: "MIT"
links:
  repository: "https://github.com/openproblems-bio/task_expression_reconstruction"
  docker_registry: "ghcr.io"
  documentation: "https://reconeval.readthedocs.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "highmem"
    - "midcpu"
    - "midtime"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      lowmem: "memory = 20.Gb"
      midmem: "memory = 50.Gb"
      highmem: "memory = 100.Gb"
      veryhighmem: "memory = 200.Gb"
      lowcpu: "cpus = 5"
      midcpu: "cpus = 15"
      highcpu: "cpus = 30"
      lowtime: "time = 1.h"
      midtime: "time = 4.h"
      hightime: "time = 8.h"
      veryhightime: "time = 24.h"
      gpu: "accelerator = 1, type = 'nvidia.com/gpu'"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "openproblems/base_python:1"
  namespace_separator: "/"
  setup:
  - type: "python"
    user: false
    packages:
    - "scanpy"
    - "anndata"
    - "scikit-learn"
    - "scikit-misc"
    upgrade: true
  entrypoint: []
  cmd: null
build_info:
  config: "src/data_processors/process_dataset/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker"
  output: "target/nextflow/data_processors/process_dataset"
  executable: "target/nextflow/data_processors/process_dataset/main.nf"
  viash_version: "0.9.4"
  git_commit: "ef5a043bc0f36622c085fad65d3ab68b8a8125f3"
  git_remote: "https://github.com/r-sayar/task_expression_reconstruction"
package_config:
  name: "task_expression_reconstruction"
  version: "build_fix_ci_test_fixtures"
  label: "Gene expression reconstruction"
  summary: "Benchmark metrics and methods for reconstructing gene expression from\
    \ single-cell latent representations."
  description: "This OpenProblems task evaluates how well methods reconstruct gene\
    \ expression\nfrom single-cell data. It provides Viash components for:\n\n1. **Data\
    \ processing** — normalize LuCA (Human Lung Cancer Cell Atlas) h5ad\n   data,\
    \ select HVGs, and split train/test cells.\n2. **Methods** — reconstruction models\
    \ (PCA baseline, autoencoder variants\n   AE/olAE/mlAE, and VAE variants scVI/mlscVI/nlscVI).\n\
    3. **Metrics** — statistical, biological, and perturbational (KNN purity)\n  \
    \ reconstruction scores.\n\nDataset: `Human Lung Cancer Cell Atlas (LuCA)\n<https://cellxgene.cziscience.com/collections/edb893ee-4066-4128-9aec-5eb2b03f8287>`_\n"
  info:
    image: "thumbnail.svg"
    test_resources:
    - type: "s3"
      path: "s3://openproblems-data/resources_test/common/"
      dest: "resources_test/common"
  repositories:
  - type: "github"
    name: "openproblems"
    repo: "openproblems-bio/openproblems"
    tag: "build/main"
  viash_version: "0.9.4"
  source: "src"
  target: "target"
  config_mods:
  - ".runners[.type == \"nextflow\"].config.labels := { lowmem : \"memory = 20.Gb\"\
    , midmem : \"memory = 50.Gb\", highmem : \"memory = 100.Gb\", veryhighmem : \"\
    memory = 200.Gb\", lowcpu : \"cpus = 5\", midcpu : \"cpus = 15\", highcpu : \"\
    cpus = 30\", lowtime : \"time = 1.h\", midtime : \"time = 4.h\", hightime : \"\
    time = 8.h\", veryhightime : \"time = 24.h\", gpu : \"accelerator = 1, type =\
    \ 'nvidia.com/gpu'\" }\n"
  authors:
  - name: "Xiaotong Fu"
    roles:
    - "author"
    info:
      github: "xiaotongfu"
  - name: "Theis Lab"
    roles:
    - "author"
    - "maintainer"
    info:
      github: "theislab"
  keywords:
  - "single-cell"
  - "openproblems"
  - "benchmark"
  - "reconstruction"
  - "reconeval"
  - "luca"
  license: "MIT"
  organization: "openproblems-bio"
  references:
    doi:
    - "10.64898/2026.06.15.731445"
  links:
    repository: "https://github.com/openproblems-bio/task_expression_reconstruction"
    docker_registry: "ghcr.io"
    documentation: "https://github.com/openproblems-bio/task_expression_reconstruction/blob/main/README.md"
    issue_tracker: "https://github.com/openproblems-bio/task_expression_reconstruction/issues"
