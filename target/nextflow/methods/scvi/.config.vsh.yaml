name: "scvi"
namespace: "methods"
version: "build_fix_ci_test_fixtures"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input_train"
    label: "Training data"
    summary: "Training cells for reconstruction methods."
    info:
      format:
        type: "h5ad"
        uns:
        - type: "string"
          name: "dataset_id"
          description: "Unique dataset identifier"
          required: true
        - type: "string"
          name: "normalization_id"
          description: "Normalization applied to .X"
          required: true
    example:
    - "resources_test/reconeval/luca/train.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input_test"
    label: "Test data"
    summary: "Held-out test cells whose expression will be reconstructed."
    info:
      format:
        type: "h5ad"
        uns:
        - type: "string"
          name: "dataset_id"
          description: "Unique dataset identifier"
          required: true
        - type: "string"
          name: "normalization_id"
          description: "Normalization applied to .X"
          required: true
    example:
    - "resources_test/reconeval/luca/test.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    label: "Predicted data"
    summary: "Reconstructed gene expression as output by a method."
    info:
      format:
        type: "h5ad"
        uns:
        - type: "string"
          name: "dataset_id"
          description: "A unique identifier for the dataset"
          required: true
        - type: "string"
          name: "normalization_id"
          description: "Which normalization was used"
          required: true
        - type: "string"
          name: "method_id"
          description: "A unique identifier for the method"
          required: true
    example:
    - "resources_test/reconeval/luca/prediction.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--variant"
    description: "scVI variant. `scvi`=standard, `mlscvi`=modeled library,\n`nlscvi`=Normal-likelihood\
      \ VAE.\n"
    info: null
    default:
    - "scvi"
    required: false
    choices:
    - "scvi"
    - "mlscvi"
    - "nlscvi"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_latent"
    description: "Dimension of the SCVI latent space."
    info: null
    default:
    - 10
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_hidden"
    description: "Hidden layer width."
    info: null
    default:
    - 128
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_layers"
    description: "Number of hidden layers in encoder/decoder."
    info: null
    default:
    - 1
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--gene_likelihood"
    description: "Optional explicit gene likelihood override. When unset, the value\
      \ is\nderived from `--variant`.\n"
    info: null
    required: false
    choices:
    - "zinb"
    - "nb"
    - "poisson"
    - "normal"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--max_kl_weight"
    description: "Target KL warmup weight (the paper's `max_kl_weight`), passed to\
      \ the\nscvi-tools training plan.\n"
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--max_epochs"
    description: "Maximum training epochs."
    info: null
    default:
    - 100
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--seed"
    description: "Random seed (reaches model init and dataloader shuffle)."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
test_resources:
- type: "python_script"
  path: "run_and_check_output.py"
  is_executable: true
- type: "python_script"
  path: "check_config.py"
  is_executable: true
- type: "file"
  path: "resources_test/reconeval/luca"
  dest: "resources_test/reconeval/luca"
info:
  preferred_normalization: "log_cp10k"
  label: "scVI"
  summary: "scvi-tools SCVI reconstruction (scVI / mlscVI / nlscVI)."
  description: "Trains an ``scvi-tools`` SCVI model on the training AnnData and returns\n\
    denoised (posterior mean) expression for the test cells via\n``get_normalized_expression``.\
    \ Expects raw counts in ``.X`` (i.e. the\ndataset was processed with ``preferred_normalization:\
    \ counts``).\n\nThe `variant` argument selects the model, matching the ReconEval\
    \ VAE\nfamily:\n\n  * `scvi`   -> scVI   (ZINB likelihood, observed library size)\n\
    \  * `mlscvi` -> mlscVI (ZINB likelihood, modeled library size)\n  * `nlscvi`\
    \ -> nlscVI (Normal/Gaussian likelihood, modeled library size)\n"
  type: "method"
  type_info:
    label: "Method"
    summary: "A gene-expression reconstruction method."
    description: "A method that learns from training cells and reconstructs expression\n\
      for held-out test cells.\n"
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
license: "MIT"
references:
  doi:
  - "10.64898/2026.06.15.731445"
links:
  repository: "https://github.com/openproblems-bio/task_expression_reconstruction"
  docker_registry: "ghcr.io"
  documentation: "https://reconeval.readthedocs.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "hightime"
    - "highmem"
    - "midcpu"
    - "gpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      lowmem: "memory = 20.Gb"
      midmem: "memory = 50.Gb"
      highmem: "memory = 100.Gb"
      veryhighmem: "memory = 200.Gb"
      lowcpu: "cpus = 5"
      midcpu: "cpus = 15"
      highcpu: "cpus = 30"
      lowtime: "time = 1.h"
      midtime: "time = 4.h"
      hightime: "time = 8.h"
      veryhightime: "time = 24.h"
      gpu: "accelerator = 1, type = 'nvidia.com/gpu'"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "openproblems/base_python:1"
  namespace_separator: "/"
  setup:
  - type: "python"
    user: false
    pip:
    - "scvi-tools>=1.1"
    upgrade: true
  - type: "docker"
    run:
    - "git clone --depth 1 --filter=blob:none --sparse https://github.com/r-sayar/ReconEval.git\
      \ /opt/ReconEval && git -C /opt/ReconEval sparse-checkout set src && printf\
      \ '%s\\n' /opt/ReconEval/src > \"$(python -c 'import site; print(site.getsitepackages()[0])')/reconeval.pth\""
  entrypoint: []
  cmd: null
build_info:
  config: "src/methods/scvi/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker"
  output: "target/nextflow/methods/scvi"
  executable: "target/nextflow/methods/scvi/main.nf"
  viash_version: "0.9.4"
  git_commit: "ef5a043bc0f36622c085fad65d3ab68b8a8125f3"
  git_remote: "https://github.com/r-sayar/task_expression_reconstruction"
package_config:
  name: "task_expression_reconstruction"
  version: "build_fix_ci_test_fixtures"
  label: "Gene expression reconstruction"
  summary: "Benchmark metrics and methods for reconstructing gene expression from\
    \ single-cell latent representations."
  description: "This OpenProblems task evaluates how well methods reconstruct gene\
    \ expression\nfrom single-cell data. It provides Viash components for:\n\n1. **Data\
    \ processing** — normalize LuCA (Human Lung Cancer Cell Atlas) h5ad\n   data,\
    \ select HVGs, and split train/test cells.\n2. **Methods** — reconstruction models\
    \ (PCA baseline, autoencoder variants\n   AE/olAE/mlAE, and VAE variants scVI/mlscVI/nlscVI).\n\
    3. **Metrics** — statistical, biological, and perturbational (KNN purity)\n  \
    \ reconstruction scores.\n\nDataset: `Human Lung Cancer Cell Atlas (LuCA)\n<https://cellxgene.cziscience.com/collections/edb893ee-4066-4128-9aec-5eb2b03f8287>`_\n"
  info:
    image: "thumbnail.svg"
    test_resources:
    - type: "s3"
      path: "s3://openproblems-data/resources_test/common/"
      dest: "resources_test/common"
  repositories:
  - type: "github"
    name: "openproblems"
    repo: "openproblems-bio/openproblems"
    tag: "build/main"
  viash_version: "0.9.4"
  source: "src"
  target: "target"
  config_mods:
  - ".runners[.type == \"nextflow\"].config.labels := { lowmem : \"memory = 20.Gb\"\
    , midmem : \"memory = 50.Gb\", highmem : \"memory = 100.Gb\", veryhighmem : \"\
    memory = 200.Gb\", lowcpu : \"cpus = 5\", midcpu : \"cpus = 15\", highcpu : \"\
    cpus = 30\", lowtime : \"time = 1.h\", midtime : \"time = 4.h\", hightime : \"\
    time = 8.h\", veryhightime : \"time = 24.h\", gpu : \"accelerator = 1, type =\
    \ 'nvidia.com/gpu'\" }\n"
  authors:
  - name: "Xiaotong Fu"
    roles:
    - "author"
    info:
      github: "xiaotongfu"
  - name: "Theis Lab"
    roles:
    - "author"
    - "maintainer"
    info:
      github: "theislab"
  keywords:
  - "single-cell"
  - "openproblems"
  - "benchmark"
  - "reconstruction"
  - "reconeval"
  - "luca"
  license: "MIT"
  organization: "openproblems-bio"
  references:
    doi:
    - "10.64898/2026.06.15.731445"
  links:
    repository: "https://github.com/openproblems-bio/task_expression_reconstruction"
    docker_registry: "ghcr.io"
    documentation: "https://github.com/openproblems-bio/task_expression_reconstruction/blob/main/README.md"
    issue_tracker: "https://github.com/openproblems-bio/task_expression_reconstruction/issues"
